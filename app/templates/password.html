{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<form method="post" action="/account/password" class="card narrow">
  <h1>Change password</h1>
  {% if user.must_change_password %}<p class="flash warn">Please choose your own password before continuing.</p>{% endif %}
  <label>Current password <input name="current" type="password" required autocomplete="current-password"></label>
  <label>New password (at least 8 characters) <input name="new" type="password" minlength="8" required autocomplete="new-password"></label>
  <label>New password again <input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label>
  <button class="primary" type="submit">Save password</button>
</form>
{% endblock %}
